<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloudberry Family Sizing Calculator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div>
      <h1 data-i18n="title"></h1>
      <p class="subtitle" data-i18n="subtitle"></p>
    </div>
    <button id="lang-toggle" type="button">EN</button>
  </div>
</header>
<main>
  <section class="card">
    <div class="field-grid">
      <div>
        <label for="data-size" data-i18n="input.datasize"></label>
        <div class="row">
          <input id="data-size" type="number" min="0" step="any" value="100">
          <select id="data-unit">
            <option value="GB">GB</option>
            <option value="TB" selected>TB</option>
            <option value="PB">PB</option>
          </select>
        </div>
      </div>
      <div>
        <label data-i18n="input.infra"></label>
        <div class="tabs" id="infra-tabs">
          <button type="button" data-infra="physical" class="active" data-i18n="infra.physical"></button>
          <button type="button" data-infra="vm" data-i18n="infra.vm"></button>
          <button type="button" data-infra="cloud" data-i18n="infra.cloud"></button>
          <button type="button" data-infra="container" data-i18n="infra.container"></button>
        </div>
      </div>
    </div>

    <div class="adv" data-for="physical">
      <label data-i18n="preset.title"></label>
      <div class="preset-cards" id="preset-cards"></div>
    </div>

    <div class="adv" data-for="vm">
      <label for="vm-profile" data-i18n="vmprofile.title"></label>
      <select id="vm-profile"></select>
      <p id="vm-profile-hint" class="hint"></p>
    </div>

    <div class="adv" data-for="cloud">
      <label for="cloud-scheme" data-i18n="scheme.title"></label>
      <select id="cloud-scheme"></select>
    </div>

    <div class="adv" data-for="container">
      <label for="ent-tier" data-i18n="adv.enttier"></label>
      <select id="ent-tier"></select>
    </div>

    <details id="advanced" class="adv" data-for="physical vm cloud">
      <summary data-i18n="advanced"></summary>
      <div class="adv-grid">
        <label>
          <span data-i18n="adv.compression"></span>
          <input id="compression" type="number" min="1" step="0.5" value="2">
        </label>
      </div>
    </details>
    <p id="input-error" class="warn" hidden data-i18n="err.invalid"></p>
  </section>

  <section class="card" id="result-card" hidden>
    <div class="result-head">
      <h2 data-i18n="result.title"></h2>
      <span id="product-line" class="product-chip"></span>
    </div>
    <p class="callout" data-i18n="disclaimer"></p>
    <p id="source-line" class="source-line" hidden></p>
    <p id="binding-badge" class="badge" hidden></p>
    <p id="huge-warning" class="warn" hidden data-i18n="warn.huge"></p>
    <div class="table-wrap">
      <table id="role-table">
        <thead><tr>
          <th data-i18n="col.role"></th><th data-i18n="col.count"></th>
          <th data-i18n="col.spec"></th><th data-i18n="col.note"></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <h2 data-i18n="summary.title"></h2>
    <table id="summary-table" class="summary"><tbody></tbody></table>
    <p id="network-line" class="meta-line"></p>
  </section>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
